<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background-color: #f5f7fa;
    }
    h3 {
      margin-top: 0;
      font-size: 16px;
      color: #101828;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary {
      background-color: #005bff;
      color: #ffffff;
    }
    .btn-primary:hover {
      background-color: #0049cc;
    }
    .btn-secondary {
      background-color: #eaedf2;
      color: #344054;
    }
    .btn-secondary:hover {
      background-color: #d0d5dd;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #475467;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <h3>Ozon JSON Exporter</h3>
  <div class="btn-group">
    <button id="downloadJson" class="btn-primary">💾 Скачать JSON</button>
    <button id="copyJson" class="btn-secondary">📋 Скопировать в буфер</button>
  </div>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
